name: CI Pipeline & Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write      # needed for GitHub Pages deploy
  pages: write
  id-token: write

jobs:
  backend-checks:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        env:
          PYTHONPATH: .
          # Provide explicit allowed origins so CORS middleware doesn't use wildcard
          ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174"
        run: |
          set -o pipefail
          python -m pytest backend/tests/ -v --tb=short 2>&1 | tee pytest_output.log

      - name: Post Pytest Summary
        if: always()
        run: |
          echo "## Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Linter (Oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
